name: Imagen Docker

# Publica la imagen en GitHub Container Registry (ghcr.io/<propietario>/kutpod):
#   · al subir una etiqueta vX.Y.Z  → X.Y.Z y latest
#   · al subir a `main` → edge
#   · a mano (Actions → Imagen Docker → Run workflow)
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kutpod" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nombre.outputs.imagen }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
