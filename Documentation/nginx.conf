# ============================================================================
# KutPod · Configuración Nginx Local para www.tupodcast.com (Procesamiento)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.tupodcast.com;

    root /var/www/html/tupodcast/kutpod;
    index site.php;

    charset utf-8;
    client_max_body_size 512M;

    # Cabeceras de seguridad HTTP inyectadas localmente
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Logs
    access_log /var/log/nginx/tupodcast.access.log;
    error_log  /var/log/nginx/tupodcast.error.log warn;

    # ========================================================================
    # Restauración de IPs Reales tras el túnel WireGuard
    # ========================================================================
    set_real_ip_from 10.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 1) Seguridad · bloquear archivos internos
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(pages|includes|api/handlers|public)/ {
        deny all;
        return 404;
    }
    location ~ ^/cli/(?!install\.php).+\.php$ { deny all; return 404; }

    location ^~ /storage/ {
        location ~* \.(db|db-wal|db-shm|sql|env|lock|log)$ {
            deny all;
            return 404;
        }
        deny all;
        return 404;
    }

    # Exponer media (audios y portadas)
    location ^~ /media/ {
        allow all;
        try_files $uri =404;
    }

    # 2) Instalador
    location = /install     { return 302 /cli/install.php; }
    location = /install/    { return 302 /cli/install.php; }

    # 3) Tracker OP3
    rewrite ^/r/([^/]+)/([^/]+)(?:/.*)?$  /r.php?show=$1&ep=$2  last;

    # 3.b) SEO · robots.txt y sitemap.xml dinámicos
    rewrite ^/robots\.txt$    /robots-sitemap.php?type=robots  last;
    rewrite ^/sitemap\.xml$   /robots-sitemap.php?type=sitemap last;

    # 4) Feeds RSS (las peticiones sin .xml caen al fallback y las procesa site.php para redirección/410)
    rewrite ^/feed/([a-zA-Z0-9\-]+)\.xml$  /feed.php?slug=$1  last;
    rewrite ^/feed\.xml$                /feed.php?slug=all last;

    # 5) API REST
    rewrite ^/api/(.*)$  /api/index.php?route=$1  last;

    # 6) ActivityPub (Mastodon / Fediverso)
    location = /.well-known/webfinger { rewrite ^ /activitypub.php?ap=webfinger last; }
    location = /.well-known/host-meta { rewrite ^ /activitypub.php?ap=host-meta last; }

    rewrite ^/users/([a-z0-9\-]+)/inbox$     /activitypub.php?ap=inbox&slug=$1    last;
    rewrite ^/users/([a-z0-9\-]+)/outbox$    /activitypub.php?ap=outbox&slug=$1    last;
    rewrite ^/users/([a-z0-9\-]+)/followers$ /activitypub.php?ap=followers&slug=$1 last;
    rewrite ^/users/([a-z0-9\-]+)/notes/([^/]+)/?$ /activitypub.php?ap=notes/$2&slug=$1 last;
    rewrite ^/users/([a-z0-9\-]+)/?$        /activitypub.php?ap=actor&slug=$1    last;

    # 7) Panel admin
    location = /admin       { rewrite ^ /index.php last; }
    location = /admin/      { rewrite ^ /index.php last; }
    rewrite ^/admin/podcast/([a-z0-9\-]+)/edit/?$  /index.php?page=edit-podcast&id=$1  last;
    rewrite ^/admin/podcast/([a-z0-9\-]+)/?$       /index.php?page=podcast&id=$1       last;
    rewrite ^/admin/([a-z0-9\-]+)/?$                /index.php?page=$1                last;

    location = /logout { return 302 /admin?action=logout; }

    # 8) Sitio público · CORS habilitado para reproductores externos
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    rewrite ^/embed/@([a-z0-9\-]+)/([a-z0-9\-]+)/?$ /site.php?r=embed&show=$1&ep=$2 last;
    rewrite ^/embed/([a-z0-9\-]+)/?$                /site.php?r=embed&ep=$1          last;
    rewrite ^/audio/@([a-z0-9\-]+)/(.+)\.mp3$ /r.php?show=$1&ep=$2 last;
    rewrite ^/@([a-z0-9\-]+)/episodes/([a-z0-9\-]+)/?$ /@$1/$2 permanent;
    rewrite ^/@([a-z0-9\-]+)/?$              /site.php?r=show&id=$1           last;
    rewrite ^/@([a-z0-9\-]+)/([a-z0-9\-]+)/?$ /site.php?r=episode&show=$1&ep=$2 last;
    rewrite ^/shows/?$                       /site.php?r=shows                last;
    rewrite ^/p/([a-z0-9\-]+)/?$            /site.php?r=page&id=$1           last;
    rewrite ^/about/?$                       /site.php?r=about                last;

    location = / { rewrite ^ /site.php last; }

    # 9) Assets estáticos
    location ^~ /assets/ {
        expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }

    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|otf|map)$ {
        expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }

    # 10) Fallback
    location / { try_files $uri $uri/ /site.php?r=home; }

    # 11) Handler PHP · FastCGI (Optimizado para PHP 8.5 e IPs Reales)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Actualizado a tu entorno PHP 8.3 real
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index site.php;
        include fastcgi_params;
        
        # Parámetros críticos de entorno y pasamanos de red
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        
        # Forzar HTTPS en PHP y arrastrar cabeceras reales limpias
        fastcgi_param HTTPS           on;
        fastcgi_param HTTP_X_REAL_IP  $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        
        # Rendimiento de buffers para descargas e hilos pesados
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # 12) Ruta interna Nginx (X-Accel-Redirect) para audios protegidos
    location /protected_media/ {
        internal;
        alias /var/www/html/tupodcast/kutpod/media/audio/;
    }
}
